# 서명된 릴리스 APK 빌드
# - v* 태그 푸시: 테스트 → 서명 빌드 → GitHub 릴리스에 APK 첨부
# - 수동 실행(workflow_dispatch): 테스트 → 서명 빌드 → 실행 결과물(artifact)로만 올림(릴리스 안 만듦)
# 서명 키는 저장소 Secrets에만 있다: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 태그와 versionName 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 versionName $NAME 이 다릅니다"
            exit 1
          fi

      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/solzzick-release.jks
          printf 'storeFile=keystore/solzzick-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: 테스트
        run: ./gradlew :core:test

      - name: 서명 빌드
        run: ./gradlew :app:assembleRelease

      - name: 서명 확인
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -m1 SHA-256
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p ../dist && cp "$APK" ../dist/solzzick-$NAME.apk

      - name: 실행 결과물로 올리기
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: solzzick-apk
          path: dist/*.apk

      - name: 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ../dist/*.apk \
            --title "솔찍 ${GITHUB_REF_NAME#v}" --generate-notes

      - name: 서명 키 지우기
        if: always()
        run: rm -f keystore/solzzick-release.jks keystore.properties
